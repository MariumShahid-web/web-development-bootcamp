<!doctype html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
        margin: 0;
        padding: 0;
      }
      .pricing-container {
        height: 100vh;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        width: 100%;
        align-items: center;
        /* padding: 160px 20px; */
        justify-content: center;
        gap: 25px;
      }
      .pricing-plan {
        background-color: rgb(235, 234, 234);
        padding: 30px 20px;
        text-align: center;
        border-radius: 5px;
      }
      .plan-title {
        font-weight: bold;
        text-align: center;
        font-size: 20px;
      }
      .plan-features {
        margin: 0;
        padding: 0;
      }
      .plan-features li {
        list-style: none;
        font-size: 13px;
        color: black;
        line-height: 28px;
      }

      .plan-price {
        font-weight: bolder;
        font-size: 30px;
        text-align: center;
      }
      .plan-button {
        background-color: coral;
        color: white;
        padding: 10px 7px;
        border-style: none;
        border-radius: 5px;
        margin-top: 10px;
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          /* border: 2px solid red; */
          display: flex;
          height: 100vh;
          width: 100vw;
          flex-direction: column;
          /* padding: 10px 460px; */
          justify-content: center;
          /* align-items: center; */
        }
        .pricing-plan {
          width: 50vw;
          /* height: 50vh; */
          padding: 40px 40px;
        }

        .plan-title {
          font-weight: bold;
          text-align: center;
          font-size: 50px;
        }
        .plan-features {
          margin: 0;
          padding: 0;
        }
        .plan-features li {
          list-style: none;
          font-size: 40px;
          color: black;
          line-height: 60px;
        }

        .plan-price {
          font-size: 60px;
        }
        .plan-button {
          font-size: 40px;
          padding: 13px 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$11.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
